<div class="flex h-full items-center justify-center">
  <form
    (ngSubmit)="onSubmit()"
    class="w-full max-w-sm rounded-lg border border-border bg-surface p-6"
  >
    <h1 class="mb-4 text-lg font-semibold text-ink">Log in</h1>

    <label class="mb-3 block text-sm">
      <span class="mb-1 block font-medium text-ink">Email</span>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
      />
    </label>

    <label class="mb-4 block text-sm">
      <span class="mb-1 block font-medium text-ink">Password</span>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
      />
    </label>

    @if (error()) {
      <p class="mb-4 text-sm text-danger">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full rounded-md bg-btn-bg px-4 py-2 text-sm text-btn-text hover:opacity-90 disabled:opacity-50"
    >
      {{ loading() && !demoLoading() ? 'Logging in...' : 'Log in' }}
    </button>

    <p class="mt-4 text-center text-sm text-ink-soft">
      No account? <a routerLink="/register" class="text-ink underline">Register</a>
    </p>

    <div class="my-5 flex items-center gap-3 text-xs text-ink-faint">
      <span class="h-px flex-1 bg-border"></span>
      or
      <span class="h-px flex-1 bg-border"></span>
    </div>

    <button
      type="button"
      (click)="onTryDemo()"
      [disabled]="loading()"
      class="w-full rounded-md border border-border-strong px-4 py-2 text-sm font-medium text-ink hover:bg-surface-sunken disabled:opacity-50"
    >
      {{ demoLoading() ? 'Starting demo...' : 'Try the demo' }}
    </button>
    <p class="mt-2 text-center text-xs text-ink-faint">
      No sign-up. Sample data, deleted after 24 hours.
    </p>
  </form>
</div>
