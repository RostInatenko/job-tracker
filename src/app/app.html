<div class="flex min-h-screen flex-col bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <h1 class="text-xl font-semibold text-slate-900">Job Application Tracker</h1>
      @if (isLoggedIn()) {
        <button
          type="button"
          (click)="onLogout()"
          class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100"
        >
          Log out
        </button>
      }
    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-6 py-8">
    <router-outlet />
  </main>
</div>
