<div class="flex min-h-screen flex-col bg-page">
  <header class="border-b border-border bg-surface">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <a routerLink="/" class="text-xl font-semibold text-ink">
        Job Application Tracker
      </a>
      <div class="flex items-center gap-2">
        @if (isLoggedIn()) {
          <a
            routerLink="/stats"
            routerLinkActive="bg-surface-sunken text-ink"
            class="rounded-md px-3 py-2 text-sm font-medium text-ink-soft hover:bg-surface-sunken"
          >
            Stats
          </a>
          <a
            routerLink="/archived"
            routerLinkActive="bg-surface-sunken text-ink"
            class="rounded-md px-3 py-2 text-sm font-medium text-ink-soft hover:bg-surface-sunken"
          >
            Archived
          </a>
        }
        <button
          type="button"
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          class="rounded-md px-3 py-2 text-sm font-medium text-ink-soft hover:bg-surface-sunken"
        >
          {{ themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode' }}
        </button>
        @if (isLoggedIn()) {
          <button
            type="button"
            (click)="onLogout()"
            class="rounded-md px-3 py-2 text-sm font-medium text-ink-soft hover:bg-surface-sunken"
          >
            Log out
          </button>
        }
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-6 py-8">
    <router-outlet />
  </main>
</div>
