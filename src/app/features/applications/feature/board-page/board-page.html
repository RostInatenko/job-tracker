<div class="mb-4 flex items-center gap-3">
  <app-quick-add-form (added)="onQuickAdd($event)" />
  <button
    type="button"
    (click)="onOpenPastePosting()"
    class="rounded-md border border-border-strong px-3 py-2 text-sm font-medium text-ink-soft hover:bg-surface-sunken"
  >
    Add from job posting
  </button>
</div>

@if (mutationError(); as message) {
  <div class="mb-4 flex items-center gap-3 rounded-md border border-danger/30 bg-danger-bg px-4 py-3 text-sm text-danger">
    <span>{{ message }}</span>
    <button type="button" (click)="onDismissMutationError()" class="font-medium underline hover:no-underline">
      Dismiss
    </button>
  </div>
}

@if (loading()) {
  <p class="text-sm text-ink-soft">Loading your applications…</p>
} @else if (error(); as message) {
  <div class="flex items-center gap-3 rounded-md border border-danger/30 bg-danger-bg px-4 py-3 text-sm text-danger">
    <span>{{ message }}</span>
    <button type="button" (click)="onRetryLoad()" class="font-medium underline hover:no-underline">
      Retry
    </button>
  </div>
} @else {
  <app-board
    [columns]="columns"
    [applicationsByStatus]="applicationsByStatus()"
    (dropped)="onDropped($event)"
    (edit)="onEdit($event)"
    (archive)="onArchiveStale($event)"
  />
}

@if (lastMove()) {
  <app-undo-toast [message]="undoMessage()" (undo)="onUndo()" />
}

@if (editingApplication(); as application) {
  <app-application-edit-modal
    [application]="application"
    (save)="onSaveEdit($event)"
    (delete)="onDeleteEdit()"
    (archiveToggled)="onArchiveToggle()"
    (close)="onCloseEdit()"
  />
}

@if (pastingPosting()) {
  <app-paste-posting-modal (added)="onPastedPosting($event)" (close)="onClosePastePosting()" />
}
