<div
  (mousedown)="onBackdropMouseDown($event)"
  (click)="onBackdropClick($event)"
  (keydown.escape)="requestClose()"
  class="fixed inset-0 flex items-center justify-center bg-black/40 p-4"
>
  <div
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="paste-posting-heading"
    class="relative flex max-h-[85vh] w-full max-w-md flex-col overflow-hidden rounded-lg border border-border bg-surface"
  >
    @if (confirmingClose()) {
      <div class="absolute inset-0 z-10 flex items-center justify-center rounded-lg bg-black/50 p-4">
        <div class="w-full max-w-xs rounded-lg border border-border bg-surface p-4 text-sm">
          <p class="mb-3 text-ink">Discard unsaved changes?</p>
          <div class="flex justify-end gap-2">
            <button
              type="button"
              (click)="onCloseCancel()"
              class="rounded-md px-3 py-1.5 text-ink-soft hover:bg-surface-sunken"
            >
              Keep editing
            </button>
            <button
              type="button"
              (click)="onCloseConfirm()"
              class="rounded-md bg-danger px-3 py-1.5 font-medium text-white hover:opacity-90"
            >
              Discard
            </button>
          </div>
        </div>
      </div>
    }
    @switch (phase()) {
      @case ('paste') {
        <div class="p-6">
          <h2 id="paste-posting-heading" class="mb-4 text-lg font-semibold text-ink">
            Add from job posting
          </h2>

          <label class="mb-3 block text-sm">
            <span class="mb-1 block font-medium text-ink">Paste the job posting text</span>
            <textarea
              [(ngModel)]="jobPostingText"
              rows="8"
              class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
            ></textarea>
          </label>

          <div class="flex items-center justify-between">
            <button
              type="button"
              (click)="onSkipToManual()"
              class="rounded-md px-3 py-2 text-sm text-ink-soft hover:bg-surface-sunken"
            >
              Fill in manually instead
            </button>
            <button
              type="button"
              (click)="onExtract()"
              class="rounded-md bg-btn-bg px-3 py-2 text-sm text-btn-text hover:opacity-90"
            >
              Extract details
            </button>
          </div>
        </div>
      }

      @case ('loading') {
        <div class="p-6">
          <h2 id="paste-posting-heading" class="mb-4 text-lg font-semibold text-ink">
            Add from job posting
          </h2>
          <p class="py-8 text-center text-sm text-ink-soft">Reading the posting…</p>
        </div>
      }

      @case ('error') {
        <div class="p-6">
          <h2 id="paste-posting-heading" class="mb-4 text-lg font-semibold text-ink">
            Add from job posting
          </h2>
          <p class="mb-4 text-sm text-danger">{{ errorMessage() }}</p>
          <div class="flex justify-end gap-2">
            <button
              type="button"
              (click)="phase.set('paste')"
              class="rounded-md px-3 py-2 text-sm text-ink-soft hover:bg-surface-sunken"
            >
              Try again
            </button>
            <button
              type="button"
              (click)="onSkipToManual()"
              class="rounded-md bg-btn-bg px-3 py-2 text-sm text-btn-text hover:opacity-90"
            >
              Fill in manually
            </button>
          </div>
        </div>
      }

      @case ('review') {
        <form [formGroup]="form" (ngSubmit)="onSave()" class="flex min-h-0 flex-col">
          <div class="overflow-y-auto p-6">
            <h2 id="paste-posting-heading" class="mb-4 text-lg font-semibold text-ink">
              Add from job posting
            </h2>

            <label class="mb-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Company</span>
              <input
                formControlName="company"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              />
            </label>

            <label class="mb-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Role</span>
              <input
                formControlName="role"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              />
            </label>

            <label class="mb-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Status</span>
              <select
                formControlName="status"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              >
                @for (column of columns; track column.status) {
                  <option [value]="column.status">{{ column.label }}</option>
                }
              </select>
            </label>

            <label class="mb-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Work mode</span>
              <select
                formControlName="workMode"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              >
                <option value="">Not specified</option>
                @for (option of workModeOptions; track option.value) {
                  <option [value]="option.value">{{ option.label }}</option>
                }
              </select>
            </label>

            <label class="mb-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Location</span>
              <input
                formControlName="location"
                placeholder="e.g. Berlin"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              />
            </label>

            <label class="mb-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Date applied</span>
              <input
                type="date"
                formControlName="dateApplied"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              />
            </label>

            <label class="mb-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Tech stack</span>
              <input
                formControlName="techStack"
                placeholder="Comma-separated, e.g. Node.js, TypeScript, Postgres"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              />
            </label>

            <label class="mb-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Salary</span>
              <input
                formControlName="salary"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              />
            </label>

            <label class="mb-0 block text-sm">
              <span class="mb-1 block font-medium text-ink">Job link</span>
              <input
                formControlName="link"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              />
            </label>

            <label class="mb-0 mt-3 block text-sm">
              <span class="mb-1 block font-medium text-ink">Notes</span>
              <textarea
                formControlName="notes"
                rows="2"
                class="w-full rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
              ></textarea>
            </label>
          </div>

          <div class="flex justify-end gap-2 border-t border-border p-6 pt-4">
            <button
              type="button"
              (click)="requestClose()"
              class="rounded-md px-3 py-2 text-sm text-ink-soft hover:bg-surface-sunken"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="rounded-md bg-btn-bg px-3 py-2 text-sm text-btn-text hover:opacity-90"
            >
              Add application
            </button>
          </div>
        </form>
      }
    }
  </div>
</div>
