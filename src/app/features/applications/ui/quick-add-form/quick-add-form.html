<form (ngSubmit)="onSubmit()" class="mb-6 flex flex-wrap items-end gap-3">
  <label class="text-sm">
    <span class="mb-1 block font-medium text-ink">Company</span>
    <input
      name="company"
      [(ngModel)]="company"
      required
      class="rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
    />
  </label>

  <label class="text-sm">
    <span class="mb-1 block font-medium text-ink">Role</span>
    <input
      name="role"
      [(ngModel)]="role"
      required
      class="rounded-md border border-border-strong bg-surface px-3 py-2 text-sm text-ink"
    />
  </label>

  <button
    type="submit"
    class="rounded-md bg-btn-bg px-4 py-2 text-sm text-btn-text hover:opacity-90"
  >
    Add application
  </button>
</form>
